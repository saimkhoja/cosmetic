<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIM – Smart Invoice Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0A4BD1;--blue-d:#06328F;--blue-l:#E7EEFF;--btn:#0A4BD1;--top:#06328F;
  --bg:#F2F5FB;--card:#FFFFFF;--text:#000000;--muted:#3F4A5E;--line:#D3DCEB;
  --ok:#067647;--ok-l:#E0F4E9;--warn:#8A4B00;--warn-l:#FFF1DB;--bad:#B42318;--bad-l:#FDEBE9;
  --r:16px;--shadow:0 1px 2px rgba(6,50,143,.06),0 6px 20px rgba(6,50,143,.05);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --receipt:'Courier New',Courier,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6E9BFF;--blue-d:#1B47B8;--blue-l:#13244A;--btn:#1F5BE0;--top:#0B2468;
  --bg:#060D1D;--card:#0D1830;--text:#FFFFFF;--muted:#C2CCE0;--line:#223459;
  --ok:#4ADE95;--ok-l:#0C2A1E;--warn:#FFC46B;--warn-l:#2E2008;--bad:#FF8A7E;--bad-l:#3A1511;--shadow:none}}
:root[data-theme="dark"]{
  --blue:#6E9BFF;--blue-d:#1B47B8;--blue-l:#13244A;--btn:#1F5BE0;--top:#0B2468;
  --bg:#060D1D;--card:#0D1830;--text:#FFFFFF;--muted:#C2CCE0;--line:#223459;
  --ok:#4ADE95;--ok-l:#0C2A1E;--warn:#FFC46B;--warn-l:#2E2008;--bad:#FF8A7E;--bad-l:#3A1511;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar */
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--top);color:#fff;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;color:#06328F;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:.02em;flex:none;position:relative}
.logo:after{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,#06328F 0 2px,transparent 2px 4px)}
.bt{font-weight:800;font-size:16px;white-space:nowrap}
.bs{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);color:#fff;border:0;white-space:nowrap}
.pill svg{font-size:17px}
.pill.off{background:#FFB020;color:#1A1200}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px}
.who b{display:block;font-size:14px}.who small{display:block;font-size:12px;opacity:.85}
.iconbtn{width:42px;height:42px;border-radius:11px;border:0;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.iconbtn.dark{background:var(--bg);color:var(--text)}

/* layout */
.layout{display:flex;min-height:calc(100vh - 64px)}
.nav{width:98px;background:var(--card);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.nav button svg{font-size:25px}
.nav button.on{background:var(--btn);color:#fff}
.nav button:not(.on):hover{background:var(--blue-l);color:var(--blue)}
main{flex:1;min-width:0;padding:22px;max-width:1360px}
main.posmain{padding:14px;max-width:none}
@media(max-width:760px){
  .layout{flex-direction:column}
  .nav{order:2;position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-top:1px solid var(--line);z-index:15;padding:6px}
  .nav button{min-width:76px;padding:8px 4px}
  main,main.posmain{padding:14px 12px 104px}
  .who div,.bs{display:none}.bt{font-size:14px}
}

/* page building blocks */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.head p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--shadow)}
.kpi .ki{width:46px;height:46px;border-radius:13px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:23px;flex:none}
.kpi.ok .ki{background:var(--ok-l);color:var(--ok)}.kpi.warn .ki{background:var(--warn-l);color:var(--warn)}.kpi.bad .ki{background:var(--bad-l);color:var(--bad)}
.kpi label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
.dual{display:flex;flex-direction:column}
.dual b{font-size:21px;font-weight:900;letter-spacing:-.01em}
.dual small{color:var(--muted);font-size:13px;font-weight:600}
.t .dual b{font-size:14.5px;font-weight:800}.t .dual small{font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--btn);color:#fff;border:0;border-radius:var(--r);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;font-weight:800;font-size:16.5px;text-align:left;min-height:128px}
.tile .ti{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.17);display:grid;place-items:center;font-size:28px}
.tile em{font-style:normal;background:#fff;color:#06328F;border-radius:999px;padding:1px 9px;font-size:13px;margin-left:6px;font-weight:900}
.tile:hover{filter:brightness(1.1)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card.p0{padding:0;overflow:hidden}
.card h3{margin:0 0 12px;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--blue);font-size:20px}
.card p{color:var(--muted);margin:0 0 12px}
.tw{overflow-x:auto}
.t{width:100%;border-collapse:collapse;font-size:14.5px}
.t th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:800;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right}
.code{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--blue-l);color:var(--blue);white-space:nowrap}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.warn{background:var(--warn-l);color:var(--warn)}.chip.bad{background:var(--bad-l);color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 17px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-weight:800;white-space:nowrap}
.btn svg{font-size:19px}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:var(--blue-l);border-color:transparent;color:var(--blue)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn.xl{min-height:58px;font-size:17.5px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.act{display:flex;gap:6px;justify-content:flex-end}
.act button{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);color:var(--blue);display:grid;place-items:center;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13.5px;font-weight:800;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted)}
.input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;background:var(--card);font-size:16px}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.input.xl{font-size:30px;font-weight:900;min-height:66px;text-align:center}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:0 13px;min-height:48px;flex:1;max-width:440px;color:var(--muted)}
.search input{border:0;background:transparent;flex:1;outline:none;font-size:15.5px;min-width:0}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--btn);color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);padding:28px;text-align:center;grid-column:1/-1}
.empty svg{font-size:40px;opacity:.55}.empty p{margin:0;font-weight:700}
.empty.tall{min-height:220px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-l);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.note svg{color:var(--blue);font-size:20px;margin-top:1px}
.note.warn{background:var(--warn-l)}.note.warn svg{color:var(--warn)}
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:52px;background:var(--btn);border-radius:9px 9px 3px 3px;min-height:4px}
.bar span{font-size:12px;color:var(--muted);font-weight:700}
.bar b{font-size:11.5px;white-space:nowrap}
.hl{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hl .trk{height:12px;background:var(--blue-l);border-radius:6px;overflow:hidden}
.hl .trk i{display:block;height:100%;background:var(--btn);border-radius:6px}
.hl b{white-space:nowrap}

/* toasts & modal */
#toasts{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;gap:9px;align-items:center;background:#00143F;color:#fff;padding:12px 17px;border-radius:13px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.28);transition:.3s}
.toast svg{font-size:19px}
.toast.ok svg{color:#4ADE95}.toast.bad{background:#B42318}.toast.warn{background:#FFB020;color:#1A1200}
.toast.go{opacity:0;transform:translateY(-8px)}
.modal-wrap{position:fixed;inset:0;background:rgba(2,10,32,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:60}
.modal-wrap[hidden]{display:none}
.modal{background:var(--card);color:var(--text);border-radius:20px;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.modal.wide{max-width:780px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);font-weight:900;font-size:19px;position:sticky;top:0;background:var(--card);z-index:1}
.modal header>svg{color:var(--blue);font-size:23px}
.modal .body{padding:20px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card)}
.lerr{color:var(--bad);font-weight:800;min-height:22px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:var(--bg)}
.hero{background:#06328F;color:#fff;padding:44px 48px;display:flex;flex-direction:column;gap:30px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:520px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 6px,transparent 6px 11px,rgba(255,255,255,.07) 11px 13px,transparent 13px 22px);transform:rotate(12deg)}
.hero .logo{width:54px;height:54px;font-size:18px;border-radius:14px}
.hero h1{font-size:clamp(34px,4.4vw,56px);line-height:1.02;margin:0;font-weight:900;letter-spacing:-.03em;max-width:12ch;position:relative}
.hero p{font-size:17px;opacity:.9;margin:0;max-width:42ch;position:relative}
.steps{list-style:none;margin:auto 0 0;padding:0;display:grid;gap:10px;position:relative;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.09);border-radius:14px;padding:12px 14px;font-size:14.5px;counter-increment:s}
.steps li:before{content:counter(s);width:26px;height:26px;border-radius:50%;background:#fff;color:#06328F;display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.panel{display:flex;align-items:center;justify-content:center;padding:28px}
.lcard{width:100%;max-width:410px}
.lcard h2{font-size:30px;margin:0 0 4px;font-weight:900;letter-spacing:-.02em}
.lcard>p{color:var(--muted);margin:0 0 22px}
.iwrap{position:relative}
.iwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:21px}
.iwrap .input{padding-left:46px;min-height:58px;font-size:17px}
.demo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.demo button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px}
.demo button svg{font-size:26px;color:var(--blue)}
.demo button small{color:var(--muted);font-weight:600;font-size:11.5px}
.demo-t{margin:22px 0 0;font-size:13px;font-weight:800;color:var(--muted)}
@media(max-width:880px){.login{grid-template-columns:1fr}.hero{padding:26px}.steps{display:none}.hero h1{font-size:34px}}

/* POS */
.pos{display:grid;grid-template-columns:1fr 410px;gap:14px;height:calc(100vh - 92px)}
@media(max-width:1020px){.pos{grid-template-columns:1fr;height:auto}}
.pos-left{display:flex;flex-direction:column;gap:12px;min-height:0}
.scan{display:flex;align-items:center;gap:10px;background:var(--card);border:2.5px solid var(--blue);border-radius:var(--r);padding:6px 6px 6px 16px;color:var(--blue)}
.scan>svg{font-size:28px}
.scan input{flex:1;border:0;background:transparent;font-size:19px;padding:12px 0;outline:none;min-width:0;font-weight:600}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none}
.cats button{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:13px;padding:11px 15px;font-weight:800;white-space:nowrap}
.cats button svg{font-size:21px;color:var(--blue)}
.cats button.on{background:var(--btn);border-color:var(--btn);color:#fff}.cats button.on svg{color:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;overflow-y:auto;align-content:start;padding-bottom:4px}
.ptile{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:138px;position:relative}
.ptile .ico{width:42px;height:42px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:23px}
.ptile .nm{font-weight:800;font-size:14.5px;line-height:1.2}
.ptile .pr{margin-top:auto;font-weight:900;font-size:16px}
.ptile .st{font-size:12.5px;color:var(--muted);font-weight:600}
.ptile .chip{position:absolute;top:10px;right:10px}
.ptile:hover{border-color:var(--blue)}
.ptile:active{transform:scale(.97)}
.ptile:disabled{opacity:.45;cursor:not-allowed}
.cart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.cart-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cart-h b{display:flex;gap:8px;align-items:center;font-size:17px;margin-right:auto}
.cart-h b svg{color:var(--blue)}
.lines{flex:1;overflow-y:auto;padding:4px 10px;min-height:120px}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:11px 2px;border-bottom:1px solid var(--line);align-items:center}
.line.flash{animation:fl .6s}@keyframes fl{from{background:var(--blue-l)}to{background:transparent}}
.ln{font-weight:800}
.lp{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:600}
.lp svg{font-size:12px}
.lt{font-weight:900;text-align:right;font-size:15.5px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:21px;display:grid;place-items:center}
.qty b{min-width:34px;text-align:center;font-size:19px}
.rm{justify-self:end;width:44px;height:44px;border-radius:12px;border:0;background:var(--bad-l);color:var(--bad);display:grid;place-items:center;font-size:21px}
.totals{padding:12px 14px 14px;border-top:1px solid var(--line)}
.totals .row{display:flex;justify-content:space-between;padding:2px 0;font-size:14.5px;font-weight:600}
.totals .row.muted{color:var(--muted);font-weight:500}
.grand{background:var(--top);color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.grand span{font-weight:800;font-size:15px;opacity:.9}
.grand b{font-size:32px;font-weight:900;letter-spacing:-.02em}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.paybtn{height:82px;border:0;border-radius:16px;background:var(--btn);color:#fff;font-size:19px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}
.paybtn svg{font-size:32px}
.paybtn:disabled{opacity:.4;cursor:not-allowed}
.paybtn.cash{background:#067647}
.disc-btn{margin-bottom:10px}
.paytotal{background:var(--top);color:#fff;border-radius:16px;padding:16px;text-align:center;margin-bottom:16px}
.paytotal small{display:block;opacity:.85;font-weight:700}
.paytotal b{font-size:40px;font-weight:900;letter-spacing:-.02em}
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.notes button{min-height:56px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-weight:900;font-size:15.5px}
.notes button.exact{background:var(--blue-l);color:var(--blue);border-color:transparent}
.change{border-radius:14px;padding:15px;text-align:center;font-weight:900;font-size:22px;background:var(--bg)}

/* ---------- security helpers ---------- */
function randHex(n){return [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function hashPw(pw,salt){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;const s=salt+'|'+pw;for(let k=0;k<4000;k++)for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'fb'+(h>>>0).toString(16)}
}

function genPw(){const a='abcdefghjkmnpqrstuvwxyz',d='23456789';let s='Sim';for(let i=0;i<3;i++)s+=a[crypto.getRandomValues(new Uint8Array(1))[0]%a.length];for(let i=0;i<3;i++)s+=d[crypto.getRandomValues(new Uint8Array(1))[0]%d.length];return s+'!'}

/* ---------- pricing, units and stock ---------- */
function unitsOf(p){return p.units&&p.units.length?p.units:[{u:p.stockUnit||'pcs',mult:1,priceUSD:p.priceUSD}]}
function unitAt(p,i){const u=unitsOf(p);return u[Math.min(i||0,u.length-1)]}
const unitLabel=u=>u.piece?'1 piece':u.u;
function unitNote(p,u){return u.piece?`single piece from an open ${p.stockUnit||'set'}`:(u.mult>1?`${u.mult} ${p.stockUnit||'pcs'}`:`single ${p.stockUnit||'pcs'}`)}
function calc(lines,dp){
  let gross=0,count=0;
  lines.forEach(l=>{const p=prod(l.pid),u=unitAt(p,l.ui);gross+=toCDF(u.priceUSD)*l.qty;count+=l.qty});
  const disc=Math.round(gross*(dp||0)/1000)*10, total=gross-disc, vr=Number(db.settings.vat)||0, vat=Math.round(total*vr/(100+vr));
  return{gross,disc,total,vat,ht:total-vat,count};
}
function totalsFrom(items,dp,vr){
  const gross=sum(items,i=>i.line), disc=Math.round(gross*(dp||0)/1000)*10, total=gross-disc, vat=Math.round(total*vr/(100+vr));
  return{gross,disc,total,vat,ht:total-vat};
}
function buildInvoice(lines,sid,dp,tendered,cashier,cashierId,t){
  const shop=shopOf(sid),T=calc(lines,dp);
  db.seq[sid]=(db.seq[sid]||1000)+1;
  const items=lines.map(l=>{const p=prod(l.pid),u=unitAt(p,l.ui);const price=toCDF(u.priceUSD);
    return{pid:p.id,name:p.name,unit:unitLabel(u),mult:u.piece?0:u.mult,piece:!!u.piece,qty:l.qty,price,line:price*l.qty,costUSD:u.piece?(p.costUSD/(p.piecesPerSet||1)):p.costUSD*u.mult}});
  return{no:`${shop.code}-${String(db.seq[sid]).padStart(6,'0')}`,shopId:sid,t,cashier,cashierId,items,gross:T.gross,discPct:dp||0,disc:T.disc,total:T.total,vat:T.vat,vatRate:Number(db.settings.vat),ht:T.ht,method:'cash',tendered,change:tendered-T.total,rate:rate(),synced:false,printed:0,edits:[]};
}
function openPcs(sid,pid){return (db.openPieces[sid]||{})[pid]||0}
function takeStock(sid,items){
  const st=db.shopStock[sid]||(db.shopStock[sid]={}), op=db.openPieces[sid]||(db.openPieces[sid]={});
  items.forEach(it=>{const p=prod(it.pid);if(!p)return;
    if(it.piece){const per=p.piecesPerSet||1;op[it.pid]=(op[it.pid]||0)+it.qty;
      while(op[it.pid]>=per){op[it.pid]-=per;st[it.pid]=(st[it.pid]||0)-1}
    } else st[it.pid]=(st[it.pid]||0)-it.qty*it.mult;
  });
}
function returnStock(sid,items){
  const st=db.shopStock[sid]||(db.shopStock[sid]={}), op=db.openPieces[sid]||(db.openPieces[sid]={});
  items.forEach(it=>{const p=prod(it.pid);if(!p)return;
    if(it.piece){const per=p.piecesPerSet||1;op[it.pid]=(op[it.pid]||0)-it.qty;
      while(op[it.pid]<0){op[it.pid]+=per;st[it.pid]=(st[it.pid]||0)+1}
    } else st[it.pid]=(st[it.pid]||0)+it.qty*it.mult;
  });
}
function cartBase(pid){return sum(cart.filter(l=>l.pid===pid),l=>{const u=unitAt(prod(l.pid),l.ui);return u.piece?0:u.mult*l.qty})}

/* ---------- persistence + offline sync ---------- */
function persist(){store.set(DBK,JSON.stringify(db))}
function log(action){db.audit.unshift({t:Date.now(),user:me?me.username:'system',action});if(db.audit.length>600)db.audit.length=600}
function getQ(){try{return JSON.parse(store.get(QK)||'[]')}catch(e){return[]}}
function online(){return navigator.onLine&&!simOffline}
function commit(action,detail){
  log(detail||action);persist();
  const q=getQ();q.push({id:uid('Q'),action,detail,t:Date.now(),by:me?me.username:'system'});store.set(QK,JSON.stringify(q));
  syncUI();if(online())flush();
}
function flush(){
  if(flushing||!online())return;
  if(!getQ().length){syncUI();return}
  flushing=true;syncUI();
  // Production: POST queued changes to the SIM server API here, then clear on success.
  setTimeout(()=>{
    if(online()){store.set(QK,'[]');db.invoices.forEach(i=>i.synced=true);db.lastSync=Date.now();persist()}
    flushing=false;syncUI();
    if(me&&view==='invoices')refreshInvoices();
  },1500);
}
function syncUI(){
  const el=$('#sync');if(!el)return;const n=getQ().length;
  if(!online()){el.className='pill off';el.innerHTML=ic('wifioff')+`<span>Offline, ${n} saved on device</span>`}
  else if(flushing){el.className='pill spin';el.innerHTML=ic('refresh')+`<span>Sending ${n} to server</span>`}
  else{el.className='pill';el.innerHTML=ic('wifi')+'<span>Online, all synced</span>'}
}
function toggleOffline(){
  simOffline=!simOffline;syncUI();
  if(simOffline)toast('Demo: internet switched off. Keep working, everything is saved.','warn');
  else{toast('Internet is back. Sending saved work.');flush()}
}
addEventListener('online',()=>{syncUI();toast('Internet is back. Sending saved work.');flush()});
addEventListener('offline',()=>{syncUI();toast('No internet. Work is being saved on this device.','warn')});
addEventListener('storage',e=>{
  if(e.key===DBK&&e.newValue){
    try{db=JSON.parse(e.newValue)}catch(err){return}
    if(me){me=db.users.find(u=>u.id===me.id)||null;if(!me||!me.active){me=null;sstore.del(SK);closeModal();render();toast('Your account was changed by the admin. Sign in again.','warn');return}}
    const a=document.activeElement;const typing=a&&['INPUT','SELECT'].includes(a.tagName)&&a.id!=='scan';
    if(me&&$('#modal').hidden&&!typing){if(view==='pos'){drawGrid();drawCart()}else render()}
  }
  if(e.key===QK)syncUI();
});

function itemPreview(){
  const c=parseFloat($('#icost').value),s=parseFloat($('#isell').value),el=$('#iprev');if(!el)return;
  if(!(s>0)){el.className='note';el.innerHTML=ic('exchange')+'<div>Enter prices to see the shop price in Francs.</div>';return}
  const m=c>=0?Math.round((s-c)/s*100):0, b=$('#ibundle').checked, pp=parseFloat($('#ippu').value), n=parseInt($('#ipcs').value)||0;
  const u1=parseInt($('#iu1').value)||0,u2=parseInt($('#iu2').value)||0;
  let extra='';
  [u1,u2].filter(x=>x>1).forEach(x=>{extra+=` ${x} for ${fCDF(toCDF(s*x*0.96))}.`});
  let bundle='';
  if(b&&pp>0)bundle=` One piece at the last price: <b>${fCDF(toCDF(pp))}</b>${n?`, ${n} pieces per set worth ${fCDF(toCDF(pp*n))}`:''}.`;
  el.className='note'+(c>s?' warn':'');
  el.innerHTML=ic(c>s?'alert':'lock')+`<div>Shops will sell at <b>${fCDF(toCDF(s))}</b>, locked.${extra}${bundle} ${c>=0?`Margin ${m}%.`:''}${c>s?' Selling price is below cost.':''}</div>`;
}
function saveItem(id){
  if(!need('admin'))return;
  const name=$('#in').value.trim(),cat=$('#ic').value,su=$('#iu').value,cost=parseFloat($('#icost').value),sell=parseFloat($('#isell').value),
        qty=parseInt($('#iq').value)||0,reo=parseInt($('#ir').value)||0,sup=$('#isup').value.trim(),err=$('#ierr'),
        isB=$('#ibundle').checked,pcs=parseInt($('#ipcs').value)||0,ppu=parseFloat($('#ippu').value),
        u1=parseInt($('#iu1').value)||0,u2=parseInt($('#iu2').value)||0;
  if(!name)return err.textContent='Enter the item name';
  if(!(cost>=0)||!(sell>0))return err.textContent='Enter valid cost and selling prices';
  if(sell<cost)return err.textContent='Selling price cannot be below cost price';
  if(isB&&(!(pcs>1)||!(ppu>0)))return err.textContent='For a mixed set, enter the pieces per set and the last price for one piece';
  if(qty<0)return err.textContent='Quantity cannot be negative';
  const units=[{u:su,mult:1,priceUSD:sell}];
  [u1,u2].filter(x=>x>1).forEach(x=>units.push({u:x===12?'dzn':(x>=48?'carton':'box'),mult:x,priceUSD:Math.round(sell*x*0.96*100)/100}));
  if(isB)units.push({u:'piece',mult:0,piece:true,priceUSD:ppu});
  let p;
  if(id){p=prod(id);const old=p.priceUSD,oldP=p.pieceUSD;
    Object.assign(p,{name,category:cat,stockUnit:su,costUSD:cost,priceUSD:sell,reorder:reo,units,isBundle:isB,piecesPerSet:isB?pcs:0,pieceUSD:isB?ppu:0});
    p.whQty+=qty;
    if(old!==sell)log(`Price changed: ${name} ${fUSD(old)} to ${fUSD(sell)}`);
    if(isB&&oldP!==ppu)log(`Piece price for ${name} set to ${fUSD(ppu)}`);
  }else{
    p={id:'P'+(Date.now()%1e7),sku:'SK-'+String(300+db.products.length),name,category:cat,stockUnit:su,costUSD:cost,priceUSD:sell,units,whQty:qty,reorder:reo,isBundle:isB,piecesPerSet:isB?pcs:0,pieceUSD:isB?ppu:0,created:Date.now()};
    db.products.push(p);db.shops.forEach(s=>{if(db.shopStock[s.id]&&db.shopStock[s.id][p.id]===undefined)db.shopStock[s.id][p.id]=0});
  }
  if(qty>0)db.purchases.unshift({t:Date.now(),pid:p.id,qty,costUSD:cost,supplier:sup,by:me.name});
  commit('item',`${id?'Updated':'Added'} item ${name}${qty?`, received ${qty}`:''}`);
  closeModal();render();toast(id?'Item saved':'Item added');
}

function orderCard(o,store){
  const shop=shopOf(o.shopId),pend=o.status==='pending',showUSD=store&&seesCost();
  const chip=o.status==='pending'?'<span class="chip warn">Waiting</span>':o.status==='dispatched'?'<span class="chip ok">Dispatched</span>':'<span class="chip bad">Rejected</span>';

    return `<tr><td><b>${esc(p.name)}</b><div class="code">${p.sku}</div></td><td class="r"><b>${it.qty}</b> ${esc(p.stockUnit)}</td>${store&&pend?`<td class="r"><span class="chip ${short?'bad':'ok'}">${p.whQty}</span></td>`:''}<td>${showUSD?dual(price):`<b>${fCDF(toCDF(price))}</b>`}</td><td>${showUSD?dual(price*it.qty):`<b>${fCDF(toCDF(price)*it.qty)}</b>`}</td></tr>`}).join('');

  return `<div class="card p0"><div style="padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)"><b style="font-size:17px">${o.id}</b>${chip}<span style="color:var(--muted)">${esc(shop.name)}, requested by ${esc(o.by)} on ${dt(o.t)}</span><span class="sp"></span>
  ${store&&pend?`<button class="btn sm" onclick="rejectOrder('${o.id}')">${ic('x')} Reject</button><button class="btn primary sm" onclick="dispatchOrder('${o.id}')">${ic('truck')} Dispatch</button>`:''}
  ${o.status==='dispatched'?`<button class="btn ghost sm" onclick="deliveryNote('${o.id}')">${ic('doc')} Delivery note</button>`:''}</div>
  <div class="tw"><table class="t"><thead><tr><th>Item</th><th class="r">Qty</th>${store&&pend?'<th class="r">Store has</th>':''}<th>Unit price</th><th>Line value</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center"><span style="color:var(--muted);font-weight:700">Order value at selling price</span>${showUSD?dual(total):`<b style="font-size:18px">${fCDF(toCDF(total))}</b>`}</div></div>`;
}
function dispatchOrder(id){
  if(!need('admin','whop'))return;
  const o=db.orders.find(x=>x.id===id);if(!o||o.status!=='pending')return;
  const short=o.items.filter(it=>prod(it.pid).whQty<it.qty);
  if(short.length){toast(`Not enough in the store: ${short.map(it=>prod(it.pid).name).join(', ')}`,'bad');return}
  o.items.forEach(it=>{const p=prod(it.pid);p.whQty-=it.qty;it.priceUSD=p.priceUSD;db.shopStock[o.shopId][it.pid]=(db.shopStock[o.shopId][it.pid]||0)+it.qty});
  Object.assign(o,{status:'dispatched',doneAt:Date.now(),doneBy:me.name,rate:rate()});
  commit('dispatch',`Dispatched ${o.id} to ${shopOf(o.shopId).name}`);render();deliveryNote(id);toast('Order dispatched. Shop stock updated.');
}
function rejectOrder(id){if(!need('admin','whop'))return;const o=db.orders.find(x=>x.id===id);if(!o)return;Object.assign(o,{status:'rejected',doneAt:Date.now(),doneBy:me.name});commit('reject',`Rejected ${o.id}`);render();toast('Order rejected','warn')}

  <hr style="border:0;border-top:1px solid #ccc;margin:14px 0"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>Deliver to:</b> ${esc(shop.name)}, ${esc(shop.address)}</div><div><b>Rate:</b> 1 USD = ${fCDF(r)}</div></div>
  <div class="tw" style="margin-top:12px"><table class="t"><thead><tr><th>Item</th><th>Code</th><th class="r">Qty</th>${showUSD?'<th class="r">Price USD</th>':''}<th class="r">Price FC</th>${showUSD?'<th class="r">Total USD</th>':''}<th class="r">Total FC</th></tr></thead><tbody>${o.items.map(it=>{const p=prod(it.pid);const u=it.priceUSD??p.priceUSD;const cdf=Math.round(u*r/10)*10;return `<tr><td>${esc(p.name)}</td><td>${p.sku}</td><td class="r">${it.qty} ${esc(p.stockUnit)}</td>${showUSD?`<td class="r">${fUSD(u)}</td>`:''}<td class="r">${fCDF(cdf)}</td>${showUSD?`<td class="r">${fUSD(u*it.qty)}</td>`:''}<td class="r">${fCDF(cdf*it.qty)}</td></tr>`}).join('')}
  <tr><td colspan="${showUSD?5:4}"><b>Total</b></td>${showUSD?`<td class="r"><b>${fUSD(total)}</b></td>`:''}<td class="r"><b>${fCDF(total*r)}</b></td></tr></tbody></table></div>
  <p style="margin:12px 0 0;color:#000"><b>Selling prices are fixed by the Admin and cannot be changed at the shop.</b></p>

/* =========================================================
   REPORTS with date range, printable and saveable as PDF
   ========================================================= */
function reportRange(){
  if(!rFrom)rFrom=ld(Date.now()-6*864e5);
  if(!rTo)rTo=today();
  if(rFrom>rTo){const x=rFrom;rFrom=rTo;rTo=x}
  const sid=me.role==='admin'?rShop:me.shopId;
  const list=db.invoices.filter(i=>(sid==='all'||i.shopId===sid)&&ld(i.t)>=rFrom&&ld(i.t)<=rTo);
  return{sid,list};
}
function setRange(k){
  const D=864e5,n=Date.now();
  if(k==='today'){rFrom=today();rTo=today()}
  else if(k==='7'){rFrom=ld(n-6*D);rTo=today()}
  else if(k==='30'){rFrom=ld(n-29*D);rTo=today()}
  else if(k==='month'){rFrom=today().slice(0,8)+'01';rTo=today()}
  render();
}
function reportsView(){
  const isAdmin=me.role==='admin',{sid,list}=reportRange();
  const total=sum(list,i=>i.total), totalUSD=sum(list,i=>i.total/i.rate), disc=sum(list,i=>i.disc), vat=sum(list,i=>i.vat);
  const items=sum(list,i=>sum(i.items,x=>x.qty));
  const cogs=sum(list,i=>sum(i.items,x=>x.costUSD*x.qty));
  const days={};list.forEach(i=>{const k=ld(i.t);days[k]=(days[k]||0)+i.total});
  const dayArr=Object.keys(days).sort().map(k=>({label:k.slice(8)+'/'+k.slice(5,7),val:days[k],txt:shortCDF(days[k])}));
  const top={};list.forEach(i=>i.items.forEach(x=>{top[x.pid]=top[x.pid]||{name:x.name,qty:0,val:0};top[x.pid].qty+=x.qty;top[x.pid].val+=x.line}));
  const topArr=Object.values(top).sort((a,b)=>b.val-a.val).slice(0,8).map(x=>({name:x.name,val:x.val,txt:fCDF(x.val)}));
  const byC={};list.forEach(i=>{byC[i.cashier]=(byC[i.cashier]||0)+i.total});
  return head('Sales report','Pick the dates, then print the report or save it as a PDF.',
   `<button class="btn primary" onclick="printReport()">${ic('printer')} Print or save as PDF</button>`)
  +`<div class="card"><div class="rangebar">
    <div class="field"><label>From</label><input type="date" class="input" value="${rFrom}" max="${today()}" onchange="rFrom=this.value;render()"></div>
    <div class="field"><label>To</label><input type="date" class="input" value="${rTo}" max="${today()}" onchange="rTo=this.value;render()"></div>
    ${isAdmin?`<div class="field"><label>Shop</label><select class="input" onchange="rShop=this.value;render()"><option value="all" ${rShop==='all'?'selected':''}>All shops</option>${db.shops.map(s=>`<option value="${s.id}" ${rShop===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`:''}
    <div class="seg">${[['today','Today'],['7','7 days'],['30','30 days'],['month','This month']].map(([k,l])=>`<button onclick="setRange('${k}')">${l}</button>`).join('')}</div></div></div>
  <div class="kpis">${kpi('receipt','Sales, VAT included',`<span class="dual"><b>${fCDF(total)}</b><small>${list.length} invoices${isAdmin?', '+fUSD(totalUSD):''}</small></span>`,'ok')}
  ${kpi('cart','Items sold',`<span class="dual"><b>${items}</b><small>${list.length?fCDF(total/list.length):fCDF(0)} average sale</small></span>`)}
  ${kpi('tag','Discounts given',`<span class="dual"><b>${fCDF(disc)}</b><small>VAT in the period ${fCDF(vat)}</small></span>`,'warn')}
  ${isAdmin?kpi('chart','Gross profit, excl. VAT',dual(sum(list,i=>i.ht/i.rate)-cogs)):kpi('cash','Cash taken',`<span class="dual"><b>${fCDF(total)}</b><small>all sales are cash</small></span>`)}</div>
  <div class="cols"><div class="card"><h3>${ic('chart')} Sales by day (FC)</h3>${dayArr.length?barsHTML(dayArr.slice(-14)):empty('chart','No sales in these dates')}</div>
  <div class="card"><h3>${ic('box')} Best sellers</h3>${hlist(topArr)}</div>
  <div class="card"><h3>${ic('users')} By cashier</h3>${hlist(Object.entries(byC).map(([n,v])=>({name:n,val:v,txt:fCDF(v)})))}</div></div>
  <div class="card p0"><div style="padding:16px 16px 0"><h3>${ic('receipt')} Invoices in this period</h3></div>${list.length?`<div class="tw"><table class="t"><thead><tr><th>Invoice</th><th>Date</th>${sid==='all'?'<th>Shop</th>':''}<th>Cashier</th><th class="r">Items</th><th class="r">Discount</th><th class="r">Total</th></tr></thead><tbody>${list.slice(0,150).map(i=>`<tr><td><b>${i.no}</b>${i.edits&&i.edits.length?' <span class="chip warn">Edited</span>':''}</td><td>${dt(i.t)}</td>${sid==='all'?`<td>${esc(shopOf(i.shopId).name)}</td>`:''}<td>${esc(i.cashier)}</td><td class="r">${sum(i.items,x=>x.qty)}</td><td class="r">${i.disc?fCDF(i.disc):'-'}</td><td class="r"><b>${fCDF(i.total)}</b></td></tr>`).join('')}</tbody></table></div>`:empty('receipt','No invoices in these dates')}</div>`;
}
function printReport(){
  const isAdmin=me.role==='admin',{sid,list}=reportRange(),c=db.settings.company;
  const total=sum(list,i=>i.total),disc=sum(list,i=>i.disc),vat=sum(list,i=>i.vat),items=sum(list,i=>sum(i.items,x=>x.qty));
  const days={};list.forEach(i=>{const k=ld(i.t);days[k]=days[k]||{n:0,q:0,d:0,v:0};days[k].n++;days[k].q+=sum(i.items,x=>x.qty);days[k].d+=i.disc;days[k].v+=i.total});
  const top={};list.forEach(i=>i.items.forEach(x=>{top[x.pid]=top[x.pid]||{name:x.name,qty:0,val:0};top[x.pid].qty+=x.qty;top[x.pid].val+=x.line}));
  const topArr=Object.values(top).sort((a,b)=>b.val-a.val).slice(0,15);
  const where=sid==='all'?'All shops':shopOf(sid).name;
  const html=`<div class="doc" id="rep"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>${esc(c.name)}</h2><div>${esc(c.address)}</div><div>RCCM ${esc(c.rccm)}, ID NAT ${esc(c.idnat)}, NIF ${esc(c.nif)}</div></div>
  <div style="text-align:right"><h2>Sales report</h2><div>${rFrom} to ${rTo}</div><div>${esc(where)}</div><div>Printed ${dt(Date.now())} by ${esc(me.name)}</div></div></div>

  <div class="frow"><div class="field"><label>Role</label><select id="ur" class="input" onchange="$('#ushopf').style.display=(this.value==='admin'||this.value==='whop')?'none':''"><option value="till">Till Operator</option><option value="shopadmin">Shop Admin</option><option value="whop">Warehouse Operator</option><option value="admin">Admin</option></select></div>

  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="ubtn" onclick="saveUser()">${ic('check')} Create login</button>`);
}
async function saveUser(){
  if(!need('admin'))return;
  const name=$('#un').value.trim(),username=$('#uu').value.trim().toLowerCase(),password=$('#up').value,role=$('#ur').value,shopId=$('#us').value,err=$('#uerr');
  if(!name)return err.textContent='Enter the full name';
  if(!/^[a-z0-9._-]{3,30}$/.test(username))return err.textContent='Username: 3 to 30 letters, numbers, dots or dashes';
  if(db.users.some(u=>u.username===username))return err.textContent='This username is already taken';
  if(!pwOk(password))return err.textContent='Password needs 8+ characters with letters and numbers';
  $('#ubtn').disabled=true;
  db.users.push(await mkUser({name,username,password,role,shopId}));
  commit('user',`Created login ${username} (${R[role]})`);closeModal();render();
  modal('Login created','check',`<p>Give these details to <b>${esc(name)}</b>. The password will not be shown again.</p><div class="card" style="font-size:18px;margin:0"><div>Username: <b>${esc(username)}</b></div><div>Password: <b>${esc(password)}</b></div></div>`,`<button class="btn primary" onclick="closeModal()">Done</button>`);
}
function openReset(id){
  if(!need('admin'))return;const u=db.users.find(x=>x.id===id);
  modal('Reset password','key',`<p>New password for <b>${esc(u.name)}</b> (${esc(u.username)})</p><div class="field"><label>New password</label><div style="display:flex;gap:8px"><input id="rp" class="input" value="${genPw()}" maxlength="64"><button class="btn ghost" onclick="$('#rp').value=genPw()">${ic('refresh')}</button></div></div><div id="rerr" class="lerr"></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveReset('${id}')">${ic('check')} Reset password</button>`);
}
async function saveReset(id){
  if(!need('admin'))return;const u=db.users.find(x=>x.id===id),p=$('#rp').value;
  if(!pwOk(p))return $('#rerr').textContent='Password needs 8+ characters with letters and numbers';
  u.salt=randHex(16);u.hash=await hashPw(p,u.salt);u.fails=0;u.lockUntil=0;
  commit('user',`Password reset for ${u.username}`);closeModal();toast('Password reset');
}
function toggleUser(id){if(!need('admin'))return;const u=db.users.find(x=>x.id===id);if(u.id===me.id)return;u.active=!u.active;commit('user',`${u.active?'Enabled':'Disabled'} ${u.username}`);render();toast(u.active?'Account enabled':'Account disabled. They are signed out.',u.active?'ok':'warn')}

function saveSettings(){
  if(!need('admin'))return;
  const r=parseFloat($('#srate').value),v=parseFloat($('#svat').value);
  if(!(r>0))return $('#serr').textContent='Enter a valid exchange rate';if(!(v>=0&&v<=30))return $('#serr').textContent='VAT must be between 0 and 30';
  const old=db.settings.rate;db.settings.rate=r;db.settings.vat=v;
  Object.assign(db.settings.company,{name:$('#cn').value.trim(),phone:$('#cp').value.trim(),address:$('#ca').value.trim(),email:$('#ce').value.trim(),rccm:$('#cr').value.trim(),idnat:$('#ci').value.trim(),nif:$('#cx').value.trim(),footer:$('#cf').value.trim()});
  commit('settings',old!==r?`Exchange rate changed ${old} to ${r}`:'Settings updated');render();toast('Settings saved');
}
function addShop(){
  if(!need('admin'))return;const n=$('#shn').value.trim(),c=$('#shc').value.trim().toUpperCase(),a=$('#sha').value.trim();
  if(!n||!/^[A-Z]{3}$/.test(c)){toast('Enter a shop name and a 3-letter code','bad');return}
  if(db.shops.some(s=>s.code===c)){toast('That code is already used','bad');return}
  const id='S'+(Date.now()%1e6);db.shops.push({id,code:c,name:n,address:a});db.shopStock[id]={};db.openPieces[id]={};db.seq[id]=1000;
  db.products.forEach(p=>db.shopStock[id][p.id]=0);
  commit('shop',`Added shop ${n}`);render();toast('Shop added');
}

/* ---------- POS / till ---------- */
function posView(){
  return `<div class="pos"><section class="pos-left">
  <div class="scan">${ic('search')}<input id="scan" autocomplete="off" spellcheck="false" placeholder="Type part of the item name, e.g. lotion" aria-label="Search items" oninput="posQuery=this.value;drawGrid()"><button class="btn primary sm" onclick="priceCheck()" title="Check a price, including the piece price of a set">${ic('tag')}<span>Price check</span></button></div>
  <div class="cats" id="cats">${catsHTML()}</div><div class="pgrid" id="pgrid"></div></section>
  <section class="cart" id="cart"></section></div>`;
}
function catsHTML(){return ['All',...CATS].map(c=>`<button class="${posCat===c?'on':''}" onclick="posCat='${c}';$('#cats').innerHTML=catsHTML();drawGrid()">${ic(CATICON[c])}<span>${c}</span></button>`).join('')}
function posAfter(){drawGrid();drawCart();const s=$('#scan');if(s){s.value=posQuery;if(matchMedia('(pointer:fine)').matches)s.focus()}}
function drawGrid(){
  const g=$('#pgrid');if(!g)return;const sid=me.shopId,st=db.shopStock[sid]||{},q=posQuery.trim().toLowerCase();
  const list=db.products.filter(p=>st[p.id]!==undefined&&(posCat==='All'||p.category===posCat)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
  g.innerHTML=list.map(p=>{const u=unitsOf(p),left=(st[p.id]||0)-cartBase(p.id);
    return `<button class="ptile" onclick="addToCart('${p.id}')"><span class="ico">${ic(p.isBundle?'gift':CATICON[p.category])}</span>
    ${p.isBundle?`<span class="chip">set + piece</span>`:(u.length>1?`<span class="chip">${u.map(x=>esc(x.u)).join(' / ')}</span>`:'')}
    <span class="nm">${esc(p.name)}</span><span class="pr">${fCDF(toCDF(p.priceUSD))}<small> / ${esc(p.stockUnit)}</small></span>
    <span class="st ${left<=0?'neg':''}">${left>0?left+' in shop':(left===0?'None left, sells on order':Math.abs(left)+' on order')}</span></button>`}).join('')||empty('search','No items found. Try another word or another category.');
}
function addToCart(pid,ui){
  const p=prod(pid);if(!p)return;const st=db.shopStock[me.shopId]||{};
  if(st[pid]===undefined){beep(false);toast('This item is not stocked in this shop','bad');return}
  const us=unitsOf(p);
  if(ui===undefined&&us.length>1)return pickUnitModal(pid,-1);
  const i=ui===undefined?0:ui,u=us[i];
  const l=cart.find(x=>x.pid===pid&&x.ui===i);
  if(l)l.qty++;else cart.unshift({pid,ui:i,qty:1});
  if(!u.piece){const left=(st[pid]||0)-cartBase(pid);if(left<0)toast(`${p.name}: selling on order, the shop is ${Math.abs(left)} short`,'warn')}
  beep(true);drawCart(true);drawGrid();
}
function pickUnitModal(pid,idx){
  const p=prod(pid),us=unitsOf(p),st=db.shopStock[me.shopId]||{};
  modal(idx>=0?'Change the unit':'How is it sold?',p.isBundle?'gift':'layers',
  `<p><b>${esc(p.name)}</b><br><span class="code">${st[p.id]>=0?st[p.id]:Math.abs(st[p.id])+' on order'} ${esc(p.stockUnit)} in the shop${p.isBundle?`, ${openPcs(me.shopId,p.id)} pieces sold from an open set`:''}</span></p>
  <div class="ugrid">${us.map((u,i)=>`<button class="ubtn" onclick="${idx>=0?`setUnit(${idx},${i})`:`pickUnit('${pid}',${i})`}"><b>${esc(unitLabel(u))}</b><span>${unitNote(p,u)}</span><em>${fCDF(toCDF(u.priceUSD))}</em></button>`).join('')}</div>
  ${p.isBundle?`<div class="note">${ic('tag')}<div>The piece price is the last price set by the Admin. It cannot be changed at the shop.</div></div>`:''}`,
  `<button class="btn" onclick="closeModal()">Cancel</button>`);
}
function pickUnit(pid,i){closeModal();addToCart(pid,i)}
function setUnit(idx,i){const l=cart[idx];if(!l)return;closeModal();const same=cart.find((x,k)=>k!==idx&&x.pid===l.pid&&x.ui===i);
  if(same){same.qty+=l.qty;cart.splice(idx,1)}else l.ui=i;
  drawCart();drawGrid()}
function priceCheck(){
  const sid=me.shopId,st=db.shopStock[sid]||{};
  modal('Price check','tag',`<div class="field"><label>Search</label><input id="pcq" class="input" placeholder="Item name" autofocus oninput="pcList(this.value)"></div><div id="pcr">${pcRows('')}</div>`,
  `<button class="btn" onclick="closeModal()">Close</button>`,true);
}
function pcList(q){const el=$('#pcr');if(el)el.innerHTML=pcRows(q)}
function pcRows(q){
  const sid=me.shopId,st=db.shopStock[sid]||{},s=(q||'').trim().toLowerCase();
  const list=db.products.filter(p=>st[p.id]!==undefined&&(!s||p.name.toLowerCase().includes(s))).slice(0,40);
  if(!list.length)return empty('search','No item matches');
  return `<div class="tw"><table class="t"><thead><tr><th>Item</th><th>Unit</th><th class="r">Price</th><th class="r">In shop</th></tr></thead><tbody>${list.map(p=>unitsOf(p).map((u,i)=>`<tr><td>${i===0?`<b>${esc(p.name)}</b>${p.isBundle?'<div class="code">mixed set</div>':''}`:''}</td><td><span class="uchip">${esc(unitLabel(u))}</span>${u.piece?' <span class="code">last price</span>':''}</td><td class="r"><b>${fCDF(toCDF(u.priceUSD))}</b></td><td class="r">${i===0?(st[p.id]<0?Math.abs(st[p.id])+' on order':st[p.id]):''}</td></tr>`).join('')).join('')}</tbody></table></div>`;
}
function chg(i,d){
  const l=cart[i];if(!l)return;
  if(d===-999||l.qty+d<=0)cart.splice(i,1);else l.qty+=d;
  if(!cart.length)cartDiscPct=0;drawCart();drawGrid();
}
function clearCart(){cart=[];cartDiscPct=0;drawCart();drawGrid();const s=$('#scan');s&&s.focus()}
function drawCart(flash){
  const c=$('#cart');if(!c)return;const T=calc(cart,cartDiscPct),st=db.shopStock[me.shopId]||{};
  c.innerHTML=`<div class="cart-h"><b>${ic('cart')} Current sale</b><span class="chip">${T.count} ${T.count===1?'item':'items'}</span>${cart.length?`<button class="iconbtn dark" onclick="clearCart()" title="Clear sale" aria-label="Clear sale">${ic('trash')}</button>`:''}</div>
  <div class="lines">${cart.length?cart.map((l,i)=>{const p=prod(l.pid),u=unitAt(p,l.ui),short=!u.piece&&(st[l.pid]||0)-cartBase(l.pid)<0;
    return `<div class="line ${flash&&i===0?'flash':''}"><div><div class="ln">${esc(p.name)}</div><div class="lp">${ic('lock')} ${fCDF(toCDF(u.priceUSD))} <button class="uchip" onclick="pickUnitModal('${l.pid}',${i})" title="Change unit">${esc(unitLabel(u))} ${ic('edit')}</button>${short?' <span class="chip warn">on order</span>':''}</div></div><div class="lt">${fCDF(toCDF(u.priceUSD)*l.qty)}</div>
  <div class="qty"><button onclick="chg(${i},-1)" aria-label="One less">${ic('minus')}</button><b>${l.qty}</b><button onclick="chg(${i},1)" aria-label="One more">${ic('plus')}</button></div><button class="rm" onclick="chg(${i},-999)" aria-label="Remove item">${ic('x')}</button></div>`}).join(''):`<div class="empty tall">${ic('cart')}<p>Tap an item to start a sale</p></div>`}</div>
  <div class="totals"><div class="row"><span>Subtotal</span><span>${fCDF(T.gross)}</span></div>
  ${T.disc?`<div class="row"><span>Invoice discount ${cartDiscPct}%</span><span>- ${fCDF(T.disc)}</span></div>`:''}
  <div class="row muted"><span>Includes VAT ${db.settings.vat}%</span><span>${fCDF(T.vat)}</span></div>
  <div class="grand"><span>To pay</span><b>${fCDF(T.total)}</b></div>
  ${me.role==='shopadmin'&&cart.length?`<button class="btn ghost full disc-btn" onclick="openCartDisc()">${ic('tag')} ${cartDiscPct?`Invoice discount ${cartDiscPct}%, change`:'Discount on this invoice'}</button>`:(cart.length?`<div class="note" style="margin:0 0 10px">${ic('lock')}<div>Only the shop admin can give a discount.</div></div>`:'')}
  <div class="paybtns one"><button class="paybtn cash" onclick="pay()" ${cart.length?'':'disabled'}>${ic('cash')} Take cash</button></div></div>`;
}
function openCartDisc(){
  if(!need('shopadmin'))return;
  modal('Discount on this invoice','tag',`<p>The discount applies to this invoice only, not to any item price. Maximum 30%.</p><div class="quick" id="cq">${[0,5,10,15,20].map(v=>`<button class="${cartDiscPct===v?'on':''}" onclick="applyCartDisc(${v})">${v?v+'%':'None'}</button>`).join('')}</div>
  <div class="field"><label>Or type %</label><input id="cdp" type="number" min="0" max="30" class="input" value="${cartDiscPct}"></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyCartDisc(parseInt($('#cdp').value)||0)">${ic('check')} Apply</button>`);
}
function applyCartDisc(v){if(!need('shopadmin'))return;if(v<0||v>30){toast('Discount must be between 0% and 30%','bad');return}cartDiscPct=v;log(`Invoice discount set to ${v}%`);persist();closeModal();drawCart()}
function pay(){
  if(!need('till','shopadmin')||!cart.length)return;const T=calc(cart,cartDiscPct);
  modal('Cash payment','cash',`<div class="paytotal"><small>Customer pays</small><b>${fCDF(T.total)}</b></div>
  <div class="field" style="margin-bottom:0"><label for="recv">Cash received (FC)</label><input id="recv" class="input xl" inputmode="numeric" autocomplete="off" oninput="updChange(${T.total})" onkeydown="if(event.key==='Enter')completeSale()" autofocus></div>
  <div class="notes"><button class="exact" onclick="setRecv(${T.total},${T.total})">Exact</button>${[1000,5000,10000,20000].map(n=>`<button onclick="addRecv(${n},${T.total})">+${fCDF(n).replace(' FC','')}</button>`).join('')}<button onclick="setRecv(0,${T.total})">${ic('x')}</button></div>
  <div id="chg" class="change">Enter the cash received</div>
  <div class="note" style="margin:14px 0 0">${ic('printer')}<div>Finishing the sale prints two copies at once: one for the customer and one for the shop.</div></div>`,
  `<button class="btn" onclick="closeModal()">Back</button><button class="btn primary" id="done" onclick="completeSale()" disabled>${ic('check')} Finish sale and print</button>`);
}
function recvVal(){return Number(($('#recv').value||'').replace(/\D/g,''))}
function setRecv(v,total){$('#recv').value=v?v.toLocaleString('en-US').replace(/,/g,' '):'';updChange(total)}
function addRecv(n,total){setRecv(recvVal()+n,total)}
function updChange(total){
  const r=recvVal(),el=$('#chg'),b=$('#done');
  if(!r){el.className='change';el.textContent='Enter the cash received';b.disabled=true;return}
  if(r<total){el.className='change bad';el.textContent=`Still needed: ${fCDF(total-r)}`;b.disabled=true}
  else{el.className='change ok';el.textContent=`Give change: ${fCDF(r-total)}`;b.disabled=false}
}
function completeSale(){
  if(!need('till','shopadmin')||!cart.length)return;
  const sid=me.shopId,T=calc(cart,cartDiscPct),tendered=recvVal();
  if(tendered<T.total){toast('Cash received is less than the total','bad');return}
  const inv=buildInvoice(cart,sid,cartDiscPct,tendered,me.name,me.id,Date.now());
  takeStock(sid,inv.items);db.invoices.unshift(inv);
  cart=[];cartDiscPct=0;
  commit('invoice',`Invoice ${inv.no}, cash, ${fCDF(inv.total)}${inv.disc?`, discount ${inv.discPct}%`:''}`);
  closeModal();drawCart();drawGrid();beep(true);
  showInvoice(inv.no,true);
  setTimeout(()=>printSale(inv.no),500);
}

/* ---------- invoices: print once, edit by shop admin ---------- */
function receiptHTML(inv,opt){
  opt=opt||{};const c=db.settings.company,shop=shopOf(inv.shopId);
  const row=(a,b,cls='')=>`<tr class="${cls}"><td>${a}</td><td class="r">${b}</td></tr>`;
  const edited=inv.edits&&inv.edits.length;
  return `<div class="receipt"><div class="c"><div class="rlogo">SIM</div><div class="big">${esc(c.name)}</div><div>${esc(shop.name)}</div><div>${esc(shop.address)}</div><div>Tél : ${esc(c.phone)}</div><div>RCCM : ${esc(c.rccm)}</div><div>ID NAT : ${esc(c.idnat)}</div><div>NIF : ${esc(c.nif)}</div></div><hr>
  <div class="c big">FACTURE${opt.dup?' (DUPLICATA)':''}</div><div class="c">${opt.copy==='shop'?'Copie magasin':'Copie client'}</div>${edited?'<div class="c">FACTURE MODIFIÉE</div>':''}<hr>
  <table>${row('N° facture',inv.no)}${row('Date',dt(inv.t))}${row('Caissier',esc(inv.cashier))}${row('Paiement','Espèces')}</table><hr>
  <table>${inv.items.map(it=>`<tr><td colspan="2">${esc(it.name)}</td></tr><tr><td>&nbsp;${it.qty} x ${esc(it.unit)} @ ${fCDF(it.price)}</td><td class="r">${fCDF(it.line)}</td></tr>`).join('')}</table><hr>
  <table>${row('Sous-total',fCDF(inv.gross))}${inv.disc?row(`Remise ${inv.discPct}%`,'- '+fCDF(inv.disc)):''}${row('Total HT',fCDF(inv.ht))}${row(`TVA ${inv.vatRate}%`,fCDF(inv.vat))}</table>
  <div class="rtotal"><span>TOTAL TTC</span><span>${fCDF(inv.total)}</span></div>
  <table>${row('Espèces reçues',fCDF(inv.tendered))}${row('Monnaie rendue',fCDF(inv.change))}${row('Articles',sum(inv.items,i=>i.qty))}</table><hr>
  ${edited?`<div class="c small">Modifiée le ${dt(inv.edits[inv.edits.length-1].t)} par ${esc(inv.edits[inv.edits.length-1].by)}</div>`:''}
  <div class="c">${esc(c.footer)}</div><div class="c small">Montants en Francs congolais (FC), TVA incluse.</div><div class="c small">Marchandise ni reprise ni échangée sans facture.</div></div>`;
}
function showInvoice(no,fresh){
  const inv=db.invoices.find(i=>i.no===no);if(!inv)return;
  const isAdmin=me.role==='shopadmin';
  const canPrint=fresh||isAdmin;
  const body=`${fresh?`<div class="change ok" style="margin-bottom:14px">Give change: ${fCDF(inv.change)}</div>`:''}
  <div class="rwrap">${receiptHTML(inv,{copy:'client',dup:!fresh})}</div>
  ${inv.edits&&inv.edits.length?`<div class="note warn">${ic('edit')}<div>Edited ${inv.edits.length} time${inv.edits.length>1?'s':''}. Last change by ${esc(inv.edits[inv.edits.length-1].by)} on ${dt(inv.edits[inv.edits.length-1].t)}: ${esc(inv.edits[inv.edits.length-1].reason)}</div></div>`:''}
  ${!inv.synced?`<div class="note warn">${ic('clock')}<div>Saved on this device. It will be sent to the server when the internet is available.</div></div>`:''}
  ${!canPrint?`<div class="note">${ic('lock')}<div>This invoice was already printed for the customer and the shop. Only the shop admin can print it again.</div></div>`:''}`;
  const foot=`<button class="btn" onclick="closeModal()">${fresh?`${ic('cart')} New sale`:'Close'}</button>
  ${isAdmin&&!fresh?`<button class="btn ghost" onclick="editInvoice('${no}')">${ic('edit')} Edit invoice</button>`:''}
  ${canPrint?`<button class="btn primary" onclick="${fresh?`printSale('${no}',true)`:`printDuplicate('${no}')`}">${ic('printer')} ${fresh?'Print customer and shop copy':'Print duplicate'}</button>`:''}`;
  modal(fresh?'Sale complete':'Invoice '+no,fresh?'check':'receipt',body,foot);
}
function printHTML(html){$('#print-area').innerHTML=html;try{window.print()}catch(e){toast('Printing is not available here','bad')}}
function printSale(no,force){
  const inv=db.invoices.find(i=>i.no===no);if(!inv)return;
  if(!force&&inv.printed>=2&&me.role!=='shopadmin'){toast('Already printed. Only the shop admin can print again.','warn');return}
  inv.printed=2;persist();
  printHTML(receiptHTML(inv,{copy:'client'})+'<div class="pagebreak"></div>'+receiptHTML(inv,{copy:'shop'}));
}
function printDuplicate(no){
  if(!need('shopadmin'))return;const inv=db.invoices.find(i=>i.no===no);if(!inv)return;
  inv.printed=(inv.printed||2)+1;commit('reprint',`Duplicate printed for ${no}`);
  printHTML(receiptHTML(inv,{copy:'client',dup:true}));
}
function editInvoice(no){
  if(!need('shopadmin'))return;const inv=db.invoices.find(i=>i.no===no);if(!inv||inv.shopId!==me.shopId)return;
  modal('Edit invoice '+no,'edit',`
  <div class="note">${ic('shield')}<div>Change quantities or remove a line, and adjust the discount on this invoice. Item prices stay as the Admin set them. Stock is corrected automatically and the change is recorded in the activity log.</div></div>
  <div class="tw"><table class="t"><thead><tr><th>Item</th><th>Unit</th><th class="r">Price</th><th style="width:120px">Qty</th></tr></thead><tbody>
  ${inv.items.map((it,i)=>`<tr><td><b>${esc(it.name)}</b></td><td><span class="uchip">${esc(it.unit)}</span></td><td class="r">${fCDF(it.price)}</td><td><input class="input" data-eq="${i}" type="number" min="0" value="${it.qty}" style="min-height:42px" oninput="previewEdit('${no}')"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="frow"><div class="field"><label>Discount on this invoice (%)</label><input id="edp" class="input" type="number" min="0" max="30" value="${inv.discPct||0}" oninput="previewEdit('${no}')"></div>
  <div class="field"><label>Cash received (FC)</label><input id="etend" class="input" type="number" min="0" value="${inv.tendered}" oninput="previewEdit('${no}')"></div></div>
  <div class="field"><label>Reason for the change</label><input id="ereason" class="input" maxlength="80" placeholder="e.g. Customer returned one lipstick" oninput="previewEdit('${no}')"></div>
  <div id="eprev" class="note"></div><div id="eerr" class="lerr"></div>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEdit('${no}')">${ic('check')} Save changes</button>`,true);
  previewEdit(no);
}
function editLines(inv){
  const items=[];
  document.querySelectorAll('[data-eq]').forEach(el=>{const i=+el.dataset.eq,q=Math.max(0,parseInt(el.value)||0);if(q>0)items.push(Object.assign({},inv.items[i],{qty:q,line:inv.items[i].price*q}))});
  return items;
}
function previewEdit(no){
  const inv=db.invoices.find(i=>i.no===no),el=$('#eprev');if(!el)return;
  const items=editLines(inv),dp=Math.min(30,Math.max(0,parseInt($('#edp').value)||0)),T=totalsFrom(items,dp,inv.vatRate);
  const tend=parseInt($('#etend').value)||0;
  el.className='note'+(T.total>tend?' warn':'');
  el.innerHTML=ic('receipt')+`<div>New total <b>${fCDF(T.total)}</b>, was ${fCDF(inv.total)}. ${items.length} line${items.length===1?'':'s'}. ${T.total>tend?'Cash received is lower than the new total, adjust it.':`Change to give back: ${fCDF(tend-T.total)}`}</div>`;
}
function saveEdit(no){
  if(!need('shopadmin'))return;
  const inv=db.invoices.find(i=>i.no===no);if(!inv||inv.shopId!==me.shopId)return;
  const items=editLines(inv),dp=Math.min(30,Math.max(0,parseInt($('#edp').value)||0)),reason=$('#ereason').value.trim(),tend=parseInt($('#etend').value)||0,err=$('#eerr');
  if(!items.length)return err.textContent='Keep at least one line on the invoice';
  if(reason.length<4)return err.textContent='Write a short reason for the change';
  const T=totalsFrom(items,dp,inv.vatRate);
  if(tend<T.total)return err.textContent='Cash received cannot be less than the new total';
  const before={total:inv.total,qty:sum(inv.items,i=>i.qty)};
  returnStock(inv.shopId,inv.items);takeStock(inv.shopId,items);
  inv.items=items;inv.discPct=dp;inv.gross=T.gross;inv.disc=T.disc;inv.total=T.total;inv.vat=T.vat;inv.ht=T.ht;inv.tendered=tend;inv.change=tend-T.total;inv.synced=false;
  inv.edits=inv.edits||[];inv.edits.push({t:Date.now(),by:me.name,reason,fromTotal:before.total,toTotal:T.total});
  commit('edit',`Invoice ${no} edited by ${me.name}: ${fCDF(before.total)} to ${fCDF(T.total)}, ${reason}`);
  closeModal();render();toast('Invoice updated. Print a duplicate if the customer needs it.');
}
function invoicesView(){
  return head('Invoices',me.role==='shopadmin'?'Find any sale, edit it if something was wrong, or print a duplicate.':'Find any sale. Printing again is done by the shop admin.')
  +`<div class="toolbar"><div class="seg">${[['today','Today'],['week','7 days'],['all','All']].map(([k,l])=>`<button class="${invF===k?'on':''}" onclick="invF='${k}';render()">${l}</button>`).join('')}</div>
  <div class="search">${ic('search')}<input placeholder="Invoice number, e.g. ${shopOf(me.shopId).code}-001005" value="${esc(invS)}" oninput="invS=this.value;refreshInvoices()"></div></div><div id="invBody">${invBody()}</div>`;
}
function refreshInvoices(){const b=$('#invBody');if(b)b.innerHTML=invBody()}
function invBody(){
  const now=Date.now(),q=invS.trim().toLowerCase(),isAdmin=me.role==='shopadmin';
  const list=db.invoices.filter(i=>i.shopId===me.shopId&&(invF==='all'||(invF==='today'?ld(i.t)===today():i.t>=now-7*864e5))&&(!q||i.no.toLowerCase().includes(q)||i.cashier.toLowerCase().includes(q)));
  const pending=list.filter(i=>!i.synced).length, edited=list.filter(i=>i.edits&&i.edits.length).length;
  return `<div class="kpis">${kpi('receipt','Total',`<span class="dual"><b>${fCDF(sum(list,i=>i.total))}</b><small>${list.length} invoices</small></span>`)}${kpi('cash','Cash taken',`<span class="dual"><b>${fCDF(sum(list,i=>i.total))}</b><small>cash only</small></span>`,'ok')}${kpi('edit','Edited',`<span class="dual"><b>${edited}</b><small>${isAdmin?'you can edit and reprint':'shop admin only'}</small></span>`,edited?'warn':'')}${kpi(pending?'clock':'cloud','Sent to server',`<span class="dual"><b>${pending?pending+' waiting':'All sent'}</b><small>${pending?'Will send when online':'Up to date'}</small></span>`,pending?'warn':'ok')}</div>
  <div class="card p0">${list.length?`<div class="tw"><table class="t"><thead><tr><th>Invoice</th><th>Time</th><th>Cashier</th><th class="r">Items</th><th class="r">Discount</th><th class="r">Total</th><th>Printing</th><th>Server</th><th></th></tr></thead><tbody>${list.slice(0,200).map(i=>`<tr>
  <td><b>${i.no}</b>${i.edits&&i.edits.length?' <span class="chip warn">Edited</span>':''}</td><td style="white-space:nowrap">${invF==='today'?tm(i.t):dt(i.t)}</td><td>${esc(i.cashier)}</td><td class="r">${sum(i.items,x=>x.qty)}</td>
  <td class="r">${i.disc?fCDF(i.disc):'-'}</td><td class="r"><b>${fCDF(i.total)}</b></td>
  <td>${i.printed>2?`<span class="chip warn">${i.printed-2} duplicate${i.printed-2>1?'s':''}</span>`:`<span class="chip">${ic('lock')} 2 copies</span>`}</td>
  <td>${i.synced?`<span class="chip ok">${ic('cloud')} Sent</span>`:`<span class="chip warn">${ic('clock')} Waiting</span>`}</td>
  <td><div class="act"><button title="View invoice" onclick="showInvoice('${i.no}')">${ic('eye')}</button>${isAdmin?`<button title="Edit invoice" onclick="editInvoice('${i.no}')">${ic('edit')}</button><button title="Print duplicate" onclick="printDuplicate('${i.no}')">${ic('printer')}</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:empty('receipt','No invoices for this period')}</div>
  ${isAdmin?'':`<div class="note">${ic('lock')}<div>Each sale prints once, a customer copy and a shop copy. If a customer needs another copy, ask the shop admin.</div></div>`}`;
}

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
});

/* ---------- start ---------- */
(async function boot(){
  $('#app').innerHTML=`<div class="empty tall" style="min-height:100vh">${ic('refresh')}<p>Starting SIM</p></div>`;
  const raw=store.get(DBK);if(raw){try{db=JSON.parse(raw)}catch(e){db=null}}
  if(!db||db.v!==2){await seed();persist()}
  if(!db.openPieces)db.openPieces={};
  db.shops.forEach(s=>{if(!db.openPieces[s.id])db.openPieces[s.id]={}});
  restore();if(me)view=NAV[me.role][0][0];
  render();if(online())flush();
})();

</script>
</body>
</html>
