# Nightly encrypted backup of every client's database to Cloudflare R2 (or any S3-compatible storage).
# The clients come from the control project (control/README.md); each is backed up in its own job by ops/backup.sh.
# Daily copies go to <folder>/daily/ (an R2 lifecycle rule deletes them after 30 days); the backup of the 1st of
# each month also goes to <folder>/monthly/ and is kept. <folder> is the client's backup_name (e.g. client2).
# See deploy/DEPLOY.md, section 8.
# Secrets: SUPABASE_ACCESS_TOKEN, CONTROL_PROJECT_REF, BACKUP_PASSPHRASE, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET. A client with its own database address saved as <FOLDER>_DB_URL (e.g. CLIENT2_DB_URL) is reached with it;
# any other client through a temporary login from the Supabase Management API.
name: Backup
on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC = 02:17 in Kinshasa
  workflow_dispatch:
    inputs:
      client:
        description: 'Only this client (its subdomain). Empty = every client.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      clients: ${{ steps.list.outputs.clients }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: List the clients
        id: list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CONTROL_PROJECT_REF: ${{ secrets.CONTROL_PROJECT_REF }}
          ONLY: ${{ inputs.client }}
        run: node ops/clients.mjs list "$ONLY"

  backup:
    needs: clients
    if: needs.clients.outputs.count != '0'
    name: ${{ matrix.client.subdomain }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        client: ${{ fromJSON(needs.clients.outputs.clients) }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PSQL: /usr/lib/postgresql/17/bin/psql
      PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
      PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ops/install-pg17.sh
      - name: Connect
        env:
          OWN_URL: ${{ secrets[matrix.client.db_secret] }}
        run: |
          if [ -n "$OWN_URL" ]; then
            printf '%s' "$OWN_URL" > "$RUNNER_TEMP/db.url"; echo "Using the saved secret ${{ matrix.client.db_secret }}"
          else
            node ops/clients.mjs db-url "${{ matrix.client.ref }}" "$RUNNER_TEMP/db.url"
          fi
          chmod 600 "$RUNNER_TEMP/db.url"
      - name: Back up
        run: ops/backup.sh "$RUNNER_TEMP/db.url" "${{ matrix.client.folder }}"
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/db.url"
